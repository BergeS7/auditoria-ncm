name: Publicar versao Windows

on:
  push:
    branches: [main]
    paths: [canal.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-versao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verificar pacote e publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 publicar.py
